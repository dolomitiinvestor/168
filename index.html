<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>168 — week time audit</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1220">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --ink:#0F1220;
    --panel:#171B2C;
    --panel-2:#1E2338;
    --line:#2A3049;
    --line-soft:#22273C;
    --text:#EAECF5;
    --dim:#8B92AD;
    --dimmer:#5B6280;
    --display:"Futura","Avenir Next",-apple-system,BlinkMacSystemFont,sans-serif;
    --body:"Avenir Next",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
    --cell:15px;
    --cellz:34px;
    --gutter:30px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--ink);color:var(--text);font-family:var(--body);
    font-size:14px;-webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
  }
  #app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}

  /* ---------- header ---------- */
  header{padding:10px 12px 8px;border-bottom:1px solid var(--line-soft);flex:none}
  .navrow{display:flex;align-items:center;gap:6px}
  .wk{
    flex:1;text-align:center;font-family:var(--display);
    font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;
  }
  .wk small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--dimmer);margin-top:2px}
  .ib{
    background:none;border:0;color:var(--dim);font-size:17px;line-height:1;
    padding:8px 10px;border-radius:8px;font-family:var(--body);
  }
  .ib:active{background:var(--panel-2);color:var(--text)}
  .ribbon{display:flex;height:7px;margin-top:10px;border-radius:4px;overflow:hidden;background:var(--panel-2)}
  .ribbon i{display:block;height:100%}
  .meter{
    display:flex;justify-content:space-between;align-items:baseline;
    font-family:var(--mono);font-size:10px;color:var(--dimmer);
    letter-spacing:.06em;margin-top:6px;
  }
  .meter b{color:var(--text);font-weight:500;font-size:12px}

  /* ---------- tabs ---------- */
  .tabs{display:flex;gap:2px;padding:0 12px 8px;flex:none}
  .tab{
    flex:1;background:none;border:0;color:var(--dimmer);padding:7px 0;
    font-family:var(--display);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    border-bottom:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tab.on{color:var(--text);border-bottom-color:var(--text)}

  /* ---------- day tab (data entry, single day, zoomed) ---------- */
  #daytab{flex:1;min-height:0;display:flex;flex-direction:column}
  .daynav{display:flex;align-items:center;justify-content:center;gap:4px;padding:0 12px 8px;flex:none}
  .daylabel{
    background:none;border:0;color:var(--text);font-family:var(--display);
    font-size:13px;letter-spacing:.12em;text-transform:uppercase;padding:6px 14px;text-align:center;
  }
  .daylabel small{display:block;font-family:var(--mono);font-size:9px;color:var(--dimmer);letter-spacing:.1em;margin-top:2px}
  #daywrap{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 12px 16px}
  .boardz{display:flex}
  .gutterz{width:var(--gutter);flex:none}
  .gutterz div{
    height:calc(var(--cellz)*4);font-family:var(--mono);font-size:10px;color:var(--dimmer);
    display:flex;align-items:flex-start;justify-content:flex-end;padding-right:6px;
    transform:translateY(-5px);letter-spacing:.02em;
  }
  .gutterz div.key{color:var(--dim)}
  .gridz{
    flex:1;display:flex;flex-direction:column;
    border-top:1px solid var(--line);border-left:1px solid var(--line);
  }
  .cellz{
    height:var(--cellz);flex:none;
    border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
    background:var(--panel);position:relative;overflow:hidden;
  }
  .cellz.h{border-bottom-color:var(--line)}
  .cellz.q{border-bottom-color:var(--line);box-shadow:inset 0 -1px 0 var(--line)}
  .cellz.on{border-right-color:rgba(0,0,0,.25);border-bottom-color:transparent}
  .cellz.on.tail{border-bottom-color:rgba(0,0,0,.28)}
  .cellz i{
    position:absolute;left:9px;top:50%;right:8px;transform:translateY(-50%);
    font-family:var(--body);font-size:13px;font-style:normal;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .cellz.dark i{color:#fff}
  .cellz.light i{color:rgba(0,0,0,.78)}

  /* ---------- week tab (view only) ---------- */
  #weektab{flex:1;min-height:0;display:none;flex-direction:column}
  .dayhead{display:flex;padding:0 12px 5px;flex:none}
  .dayhead .sp{width:var(--gutter);flex:none}
  .dayhead div.d{
    flex:1;text-align:center;font-family:var(--display);font-size:10px;
    letter-spacing:.1em;color:var(--dim);
  }
  .dayhead div.d.today{color:var(--text)}
  .dayhead div.d span{display:block;font-family:var(--mono);font-size:8px;color:var(--dimmer);margin-top:1px}

  #gridwrap{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 12px 16px}
  .board{display:flex}
  .gutter{width:var(--gutter);flex:none;position:relative}
  .gutter div{
    height:calc(var(--cell)*4);font-family:var(--mono);font-size:8.5px;color:var(--dimmer);
    display:flex;align-items:flex-start;justify-content:flex-end;padding-right:5px;
    transform:translateY(-4px);letter-spacing:.02em;
  }
  .gutter div.key{color:var(--dim)}
  .grid{
    flex:1;display:grid;grid-template-columns:repeat(7,1fr);
    grid-auto-rows:var(--cell);
    border-top:1px solid var(--line);border-left:1px solid var(--line);
  }
  .cell{
    border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);
    background:var(--panel);position:relative;overflow:hidden;
  }
  .cell.h{border-bottom-color:var(--line)}
  .cell.q{border-bottom-color:var(--line);box-shadow:inset 0 -1px 0 var(--line)}
  .cell.on{border-right-color:rgba(0,0,0,.25);border-bottom-color:transparent}
  .cell.on.tail{border-bottom-color:rgba(0,0,0,.28)}
  .cell i{
    position:absolute;left:2px;top:1px;right:1px;font-family:var(--mono);font-size:7.5px;
    letter-spacing:.02em;text-transform:uppercase;font-style:normal;opacity:.85;
    white-space:nowrap;overflow:hidden;
  }
  .cell.dark i{color:#fff}
  .cell.light i{color:rgba(0,0,0,.75)}
  .hint{
    font-size:11px;color:var(--dimmer);line-height:1.5;padding:10px 2px 12px;
  }
  .hint b{color:var(--dim);font-weight:500}

  /* ---------- palette ---------- */
  footer{
    position:relative;
    flex:none;border-top:1px solid var(--line-soft);background:var(--panel);
    padding:9px 0 calc(9px + env(safe-area-inset-bottom));
  }

  /* ---------- floating action button ---------- */
  .fabs{
    position:absolute;right:14px;bottom:calc(100% + 14px);
    display:flex;align-items:center;gap:12px;z-index:15;
  }
  .fab{
    width:56px;height:56px;flex:none;border-radius:50%;border:0;
    background:var(--panel-2);color:var(--text);font-family:var(--mono);
    font-size:22px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.45);
  }
  .fab:active{transform:scale(.94)}
  .fab.primary{background:var(--text);color:var(--ink);font-size:30px;font-weight:300;font-family:var(--body)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:0 12px;-webkit-overflow-scrolling:touch}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;
    background:var(--panel-2);border:1px solid transparent;color:var(--dim);
    font-family:var(--body);font-size:12.5px;white-space:nowrap;
  }
  .chip u{width:9px;height:9px;border-radius:50%;display:block;text-decoration:none}
  .chip.on{color:#0F1220;font-weight:600}
  .chip.on u{background:rgba(0,0,0,.35)!important}
  .chip.erase.on{background:var(--text);color:var(--ink)}
  .chip.add{color:var(--dimmer);font-family:var(--mono)}

  /* ---------- totals ---------- */
  #totals{flex:1;overflow-y:auto;padding:4px 14px 24px;-webkit-overflow-scrolling:touch;display:none}
  .big{font-family:var(--mono);font-size:44px;letter-spacing:-.03em;line-height:1;margin:8px 0 0}
  .big span{font-size:16px;color:var(--dimmer);letter-spacing:0}
  .cap{font-family:var(--display);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px}
  .row{display:flex;align-items:center;gap:9px;padding:7px 0}
  .row u{width:10px;height:10px;border-radius:2px;flex:none;text-decoration:none}
  .row .nm{flex:1;font-size:13px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .row .hr{font-family:var(--mono);font-size:13px}
  .row .pc{font-family:var(--mono);font-size:10px;color:var(--dimmer);width:34px;text-align:right}
  .bar{height:3px;background:var(--panel-2);border-radius:2px;overflow:hidden;margin-top:-2px}
  .bar i{display:block;height:100%}
  .days{display:flex;gap:5px;align-items:flex-end;height:104px;margin-top:4px}
  .days .col{flex:1;height:100%;display:flex;flex-direction:column-reverse;background:var(--panel-2);border-radius:3px;overflow:hidden}
  .days .col i{display:block;width:100%}
  .dlbl{display:flex;gap:5px;margin-top:6px}
  .dlbl div{flex:1;text-align:center;font-family:var(--mono);font-size:9px;color:var(--dimmer)}
  .dlbl div b{display:block;color:var(--dim);font-weight:400;font-size:10px}
  .empty{color:var(--dimmer);font-size:12.5px;line-height:1.6;padding:20px 0}

  /* ---------- timer (stopwatch tab) ---------- */
  #timer{flex:1;overflow-y:auto;padding:2px 14px 24px;-webkit-overflow-scrolling:touch;display:none}
  .swrunning{border-radius:16px;padding:18px;text-align:center;margin-bottom:16px}
  .swrunning-name{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.85}
  .swrunning-clock{font-family:var(--mono);font-size:40px;letter-spacing:-.02em;margin-top:6px}
  .swrunning-started{font-family:var(--mono);font-size:10px;opacity:.75;margin-top:4px}
  .swrunning-actions{display:flex;gap:10px;margin-top:16px}
  .swbtn{flex:1;background:rgba(0,0,0,.2);border:0;color:inherit;border-radius:10px;padding:12px 0;font-weight:600;font-size:13px;font-family:var(--body)}
  .swbtn.ghost{background:rgba(0,0,0,.08)}
  .swhint{font-size:11px;color:var(--dimmer);line-height:1.5;padding:0 2px 14px}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .tile{
    aspect-ratio:1.35;border:0;border-radius:16px;position:relative;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;
    font-family:var(--display);font-size:14px;letter-spacing:.03em;text-transform:uppercase;font-weight:600;
  }
  .tile:active{transform:scale(.97)}
  .tile.active{box-shadow:0 0 0 3px var(--text) inset}
  .tile.dim{opacity:.38}
  .tile-tag{
    position:absolute;bottom:10px;left:0;right:0;font-family:var(--mono);
    font-size:8px;letter-spacing:.15em;text-transform:uppercase;opacity:.85;
  }

  /* ---------- sheet ---------- */
  .scrim{position:fixed;inset:0;background:rgba(8,10,18,.7);display:none;z-index:20}
  .scrim.on{display:block}
  .sheet{
    position:absolute;left:0;right:0;bottom:0;background:var(--panel);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    max-height:86%;overflow-y:auto;max-width:560px;margin:0 auto;
  }
  .sheet h3{font-family:var(--display);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0 0 10px}
  .act{
    display:block;width:100%;text-align:left;background:var(--panel-2);border:0;color:var(--text);
    font-family:var(--body);font-size:14px;padding:13px 14px;border-radius:10px;margin-bottom:7px;
  }
  .act:active{background:var(--line)}
  .act.danger{color:#FF8080}
  .catrow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
  .catrow u{width:11px;height:11px;border-radius:3px;flex:none;text-decoration:none}
  .catrow span{flex:1;font-size:13px}
  .catrow .hrs{font-family:var(--mono);font-size:11px;color:var(--dimmer)}
  .catrow button{background:none;border:0;color:var(--dimmer);font-size:17px;padding:4px 6px}
  .newcat{display:flex;gap:8px;margin-top:14px}
  .newcat input{
    flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:11px 12px;font-family:var(--body);font-size:14px;min-width:0;
  }
  .newcat input:focus{outline:none;border-color:var(--dim)}
  .newcat button{background:var(--text);color:var(--ink);border:0;border-radius:9px;padding:0 16px;font-size:13px;font-weight:600}
  .swatches{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
  .swatches u{width:24px;height:24px;border-radius:6px;text-decoration:none;border:2px solid transparent}
  .swatches u.on{border-color:var(--text)}

  /* ---------- add activity ---------- */
  .daypick{display:flex;gap:5px}
  .daypick button{
    flex:1;background:var(--panel-2);border:0;color:var(--dim);padding:9px 0;border-radius:9px;
    font-family:var(--mono);font-size:11px;
  }
  .daypick button.on{background:var(--text);color:var(--ink);font-weight:600}
  .catpick{display:flex;flex-wrap:wrap;gap:7px}
  .catpick button{
    display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:20px;
    background:var(--panel-2);border:1px solid transparent;color:var(--dim);
    font-family:var(--body);font-size:12.5px;
  }
  .catpick button u{width:9px;height:9px;border-radius:50%;display:block;text-decoration:none}
  .catpick button.on{color:#0F1220;font-weight:600}
  .timerow{display:flex;align-items:center;gap:10px}
  .timerow select,.timerow input{
    flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:11px 10px;font-family:var(--mono);font-size:14px;min-width:0;
  }
  .timerow input::placeholder{color:var(--dimmer)}
  .timerow span{color:var(--dimmer);font-size:12px}
  .timemode{
    background:none;border:0;color:var(--dimmer);font-family:var(--body);
    font-size:11px;text-decoration:underline;padding:0;
  }
  @media (prefers-reduced-motion:no-preference){
    .cell,.cellz{transition:background-color .09s ease}
  }
</style>

<div id="app">
  <header>
    <div class="navrow">
      <button class="ib" id="prev">‹</button>
      <div class="wk"><span id="wklabel">—</span><small id="wksub"></small></div>
      <button class="ib" id="undo">↺</button>
      <button class="ib" id="menu">⋯</button>
    </div>
    <div class="ribbon" id="ribbon"></div>
    <div class="meter"><span><b id="logged">0</b> of 168 h logged</span><span id="unlogged"></span></div>
  </header>

  <div class="tabs">
    <button class="tab on" data-v="day">Day</button>
    <button class="tab" data-v="week">Week</button>
    <button class="tab" data-v="timer">Timer</button>
    <button class="tab" data-v="totals">Totals</button>
  </div>

  <div id="daytab">
    <div class="daynav">
      <button class="ib" id="dayprev">‹</button>
      <button class="daylabel" id="daylabel">—</button>
      <button class="ib" id="daynext">›</button>
    </div>
    <div id="daywrap">
      <div class="boardz">
        <div class="gutterz" id="dayGutter"></div>
        <div class="gridz" id="dayGrid"></div>
      </div>
      <div class="hint"><b>Tap</b> a cell to log 15 minutes. <b>Press and hold, then drag</b> to fill a block. Tap a filled cell again to clear it. Need exact minutes? Use <b>+ → Type it in</b>.</div>
    </div>
  </div>

  <div id="weektab">
    <div class="dayhead" id="dayhead"></div>
    <div id="gridwrap">
      <div class="board">
        <div class="gutter" id="gutter"></div>
        <div class="grid" id="grid"></div>
      </div>
      <div class="hint">View only — switch to <b>Day</b> to log time.</div>
    </div>
  </div>

  <div id="timer"></div>

  <div id="totals"></div>

  <footer>
    <div class="fabs" id="fabs">
      <button class="fab primary" id="addact" title="Add activity">+</button>
    </div>
    <div class="chips" id="chips"></div>
  </footer>
</div>

<div class="scrim" id="scrim"><div class="sheet" id="sheet"></div></div>

<script>
/* week[] is minute-resolution: SLOTS=1440 minutes/day. The grid UI still taps/drags in
   15-minute blocks (QSLOTS=96/day) — each block writes all 15 underlying minutes, so any
   new stroke or typed/stopwatch entry always overwrites (blocks out) whatever was there. */
const SLOTS=1440, DAYS=7, N=SLOTS*DAYS;
const QSLOTS=96;
const LEGACY_SLOTS=48; // ancient 30-min format, migration only
const CELLZ=34; // must match --cellz in CSS
const DAYNAMES=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const SWATCH=["#2E8FD4","#6B4FC9","#17A2A2","#2FAE72","#C08A2E","#E2593A","#D8579B","#E8B93E","#6B7A94","#9C6BE0","#4FBF9F","#E0704F"];
const DEFAULTS=[
  {id:"sleep",name:"Sleep",color:"#6B4FC9"},
  {id:"work",name:"Work",color:"#2E8FD4"},
  {id:"commute",name:"Commute",color:"#C08A2E"},
  {id:"workout",name:"Workout",color:"#2FAE72"},
  {id:"eat",name:"Eat",color:"#E2593A"},
  {id:"family",name:"Family",color:"#D8579B"},
  {id:"chores",name:"Chores",color:"#6B7A94"},
  {id:"learn",name:"Learning",color:"#17A2A2"},
  {id:"leisure",name:"Leisure",color:"#E8B93E"}
];

/* ---------- storage (localStorage, stays on this device) ---------- */
const mem={};
const store={
  async get(k){
    try{const v=localStorage.getItem(k);if(v!==null)return JSON.parse(v)}catch(e){}
    return k in mem?mem[k]:null;
  },
  async set(k,v){
    mem[k]=v;
    try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}
  },
  keys(){
    const out=[];
    try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("tt:"))out.push(k)}}catch(e){}
    return out;
  },
  del(k){try{localStorage.removeItem(k)}catch(e){}delete mem[k]}
};

/* ---------- state ---------- */
let cats=DEFAULTS.slice();
let cur=mondayOf(new Date());
let week=new Array(N).fill(null);
let sel=cats[0].id;
let undoStack=[];
let newColor=SWATCH[0];
let runningTimer=null;
let dOff=dayIndexInWeek(new Date());
let timeInputMode="pick";
try{timeInputMode=localStorage.getItem("tt:timemode")||"pick"}catch(e){}

const $=s=>document.querySelector(s);
const grid=$("#grid");
const dayGrid=$("#dayGrid");

function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function keyOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function shift(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function dayIndexInWeek(d){const mon=mondayOf(d);return Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-mon)/86400000)}
function catOf(id){return cats.find(c=>c.id===id)}
function fmtH(h){
  const q=Math.round(h*4);
  if(q%4===0)return String(q/4);
  if(q%2===0)return (q/4).toFixed(1);
  return (q/4).toFixed(2);
}
function light(hex){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)>150;
}
function hourLabel(h){
  const ap=h<12?"a":"p", hh=h%12===0?12:h%12;
  return hh+ap;
}
/* label for a quarter-hour grid slot (0..QSLOTS), used by the coarse Pick dropdown */
function qLabel(q){
  if(q>=QSLOTS)return "12a";
  const h=Math.floor(q/4), m=(q%4)*15;
  const ap=h<12?"a":"p", hh=h%12===0?12:h%12;
  return hh+(m?":"+String(m).padStart(2,"0"):"")+ap;
}
/* label for an exact minute-of-day (0..SLOTS), used by the Type field */
function minuteLabel(mn){
  if(mn>=SLOTS)return "12:00a";
  const h=Math.floor(mn/60), m=mn%60;
  const ap=h<12?"a":"p", hh=h%12===0?12:h%12;
  return hh+":"+String(m).padStart(2,"0")+ap;
}
/* accepts "9", "9:30am", "9:30pm", "21:30" — no am/pm means 1-11 is AM, 12 is noon, 13-23 is 24h.
   Returns an exact minute-of-day (0..SLOTS), not rounded to any block. */
function parseTimeStr(s){
  s=(s||"").trim();
  if(!s)return null;
  const m=s.match(/^(\d{1,2})(?::(\d{2}))?\s*([ap])?\.?m?\.?$/i);
  if(!m)return null;
  let h=+m[1];
  const mins=m[2]!==undefined?+m[2]:0;
  if(mins>59)return null;
  const ap=m[3]?m[3].toLowerCase():null;
  if(ap==="a"){if(h<1||h>12)return null;if(h===12)h=0}
  else if(ap==="p"){if(h<1||h>12)return null;if(h!==12)h+=12}
  else if(h>23)return null;
  return Math.max(0,Math.min(SLOTS,h*60+mins));
}
/* the minute right after the day's latest logged minute, or "now" if the day is empty */
function defaultStartForDay(dayIdx){
  let lastEnd=-1;
  for(let m=0;m<SLOTS;m++)if(week[dayIdx*SLOTS+m]!=null)lastEnd=m+1;
  if(lastEnd>=0)return Math.min(SLOTS-1,lastEnd);
  if(keyOf(shift(cur,dayIdx))===keyOf(new Date())){
    const now=new Date();
    return Math.min(SLOTS-1,Math.max(0,now.getHours()*60+now.getMinutes()));
  }
  return 0;
}
function fmtClockTime(d){
  const h=d.getHours(),m=d.getMinutes(),ap=h<12?"a":"p",hh=h%12===0?12:h%12;
  return hh+":"+String(m).padStart(2,"0")+ap;
}
function fmtElapsed(ms){
  let s=Math.max(0,Math.floor(ms/1000));
  const h=Math.floor(s/3600);s%=3600;
  const m=Math.floor(s/60);s%=60;
  return (h?h+":"+String(m).padStart(2,"0"):String(m))+":"+String(s).padStart(2,"0");
}
function floor1(d){const step=60000;return new Date(Math.floor(d.getTime()/step)*step)}
function ceil1(d){const step=60000;return new Date(Math.ceil(d.getTime()/step)*step)}

/* ---------- render ---------- */
function baseCls(q){return "cell"+(q%4===3?" h":"")+((q+1)%24===0?" q":"")}
function baseClsZ(q){return "cellz"+(q%4===3?" h":"")+((q+1)%24===0?" q":"")}
/* the category shown for a 15-minute grid block: the block's first minute.
   (a block written by the grid is always uniform; one written by a precise
   typed/stopwatch entry that doesn't land on a 15-min boundary is approximated) */
function quarterCat(day,q){return week[day*SLOTS+q*15]}

function paintCells(){
  const cells=grid.children;
  for(let k=0;k<cells.length;k++){
    const el=cells[k], i=+el.dataset.i, day=Math.floor(i/QSLOTS), q=i%QSLOTS;
    const id=quarterCat(day,q);
    const c=id?catOf(id):null;
    if(!c){
      el.style.background="";el.className=baseCls(q);el.firstChild.textContent="";
      continue;
    }
    const prev=q>0?quarterCat(day,q-1):null;
    const next=q<QSLOTS-1?quarterCat(day,q+1):null;
    el.style.background=c.color;
    el.className=baseCls(q)+" on "+(light(c.color)?"light":"dark")+(next===id?"":" tail");
    el.firstChild.textContent=(prev!==id&&next===id)?c.name.slice(0,7):"";
  }
}
function paintDay(){
  const cells=dayGrid.children;
  for(let q=0;q<QSLOTS;q++){
    const el=cells[q], id=quarterCat(dOff,q);
    el.dataset.i=dOff*QSLOTS+q;
    const c=id?catOf(id):null;
    if(!c){
      el.style.background="";el.className=baseClsZ(q);el.firstChild.textContent="";
      continue;
    }
    const prev=q>0?quarterCat(dOff,q-1):null;
    const next=q<QSLOTS-1?quarterCat(dOff,q+1):null;
    el.style.background=c.color;
    el.className=baseClsZ(q)+" on "+(light(c.color)?"light":"dark")+(next===id?"":" tail");
    el.firstChild.textContent=(prev!==id)?c.name:"";
  }
}

function renderTotals(){
  const m=totalsByCat(), used=Object.values(m).reduce((a,b)=>a+b,0);
  const list=cats.filter(c=>m[c.id]).sort((a,b)=>m[b.id]-m[a.id]);

      +(used?Math.round(used/N*100)+"% OF THE WEEK ACCOUNTED FOR":"NOTHING LOGGED YET")+'</div>';
  if(!used){
    html+='<div class="empty">Fill in the day view and this page will show where the hours actually went — per category, per day.</div>';
    $("#totals").innerHTML=html;return;
  }
  html+='<div class="cap">Where the hours go</div>';
  for(const c of list){

      +'<span class="hr">'+fmtH(h)+' h</span><span class="pc">'+Math.round(m[c.id]/N*100)+'%</span></div>'
      +'<div class="bar"><i style="width:'+(m[c.id]/N*100)+'%;background:'+c.color+'"></i></div>'
      +'<div style="font-family:var(--mono);font-size:9px;color:var(--dimmer);margin-top:5px">'+fmtH(Math.round(h/7*10)/10)+' h/day avg</div>';
  }
  const unl=N-used;
  html+='<div class="row" style="opacity:.6"><u style="background:var(--line)"></u><span class="nm">Unlogged</span>'
      +'<span class="hr">'+fmtH(unl/60)+' h</span><span class="pc">'+Math.round(unl/N*100)+'%</span></div>';

  html+='<div class="cap">Day by day</div><div class="days">';
  for(let d=0;d<DAYS;d++){
    html+='<div class="col">';
    for(const c of cats){
      let n=0;for(let m=0;m<SLOTS;m++)if(week[d*SLOTS+m]===c.id)n++;
      if(n)html+='<i style="height:'+(n/SLOTS*100)+'%;background:'+c.color+'"></i>';
    }

  html+='</div><div class="dlbl">';
  for(let d=0;d<DAYS;d++){
    let n=0;for(let m=0;m<SLOTS;m++)if(week[d*SLOTS+m])n++;
    html+='<div>'+DAYNAMES[d][0]+'<b>'+fmtH(n/60)+'</b></div>';
  }
  html+='</div>';
  $("#totals").innerHTML=html;
}

/* ---------- editing ---------- */
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>store.set("tt:w:"+keyOf(cur),week),350);
}
function snapshot(){undoStack.push(week.slice());if(undoStack.length>30)undoStack.shift()}
/* i is a flattened grid index: day*QSLOTS+q. Always overwrites all 15 minutes of that
   block, so a new stroke blocks out whatever was there — grid paint or precise typed entry. */
function setCell(i,how){
  const day=Math.floor(i/QSLOTS), q=i%QSLOTS;
  const v=sel==="__erase"?null:sel;
  const base=day*SLOTS+q*15;
  if(how==="toggle"){
    let same=true;
    for(let m=0;m<15;m++)if(week[base+m]!==v){same=false;break}
    const nv=same?null:v;
    for(let m=0;m<15;m++)week[base+m]=nv;
  }else{
    for(let m=0;m<15;m++)week[base+m]=v;
  }
}

function cellAt(x,y,sel){
  const el=document.elementFromPoint(x,y);
  if(!el)return -1;
  const c=el.closest?el.closest(sel||".cell"):null;
  return c?+c.dataset.i:-1;
}

/* single-day zoomed grid: press/hold/drag to paint, tap to toggle */
let holdT=null,painting=false,sy=0,startI=-1,moved=false;
dayGrid.addEventListener("touchstart",e=>{
  const t=e.touches[0];sy=t.clientY;moved=false;
  startI=cellAt(t.clientX,t.clientY,".cellz");
  if(startI<0)return;
  holdT=setTimeout(()=>{
    painting=true;snapshot();setCell(startI,"set");renderAll();save();
    if(navigator.vibrate)navigator.vibrate(8);
  },170);
},{passive:true});
dayGrid.addEventListener("touchmove",e=>{
  const t=e.touches[0];
  if(painting){
    e.preventDefault();
    const i=cellAt(t.clientX,t.clientY,".cellz");
    if(i>=0&&quarterCat(Math.floor(i/QSLOTS),i%QSLOTS)!==(sel==="__erase"?null:sel)){setCell(i,"set");renderAll();save()}
    return;
  }
  if(Math.abs(t.clientY-sy)>9){moved=true;clearTimeout(holdT)}
},{passive:false});
dayGrid.addEventListener("touchend",()=>{
  clearTimeout(holdT);
  if(!painting&&!moved&&startI>=0){snapshot();setCell(startI,"toggle");renderAll();save()}
  painting=false;startI=-1;
});
dayGrid.addEventListener("touchcancel",()=>{clearTimeout(holdT);painting=false});

let mdown=false;

/* ---------- navigation ---------- */
function migrateWeek(d){
  if(!Array.isArray(d))return null;
  if(d.length===N)return d; // current minute-resolution format
  if(d.length===QSLOTS*DAYS){ // previous release: one entry per 15 minutes
    const out=new Array(N).fill(null);
    for(let day=0;day<DAYS;day++){
      for(let q=0;q<QSLOTS;q++){
        const v=d[day*QSLOTS+q], base=day*SLOTS+q*15;
        for(let m=0;m<15;m++)out[base+m]=v;
      }
    }
    return out;
  }
  if(d.length===LEGACY_SLOTS*DAYS){ // ancient format: one entry per 30 minutes
    const out=new Array(N).fill(null);
    for(let day=0;day<DAYS;day++){
      for(let h=0;h<LEGACY_SLOTS;h++){
        const v=d[day*LEGACY_SLOTS+h], base=day*SLOTS+h*30;
        for(let m=0;m<30;m++)out[base+m]=v;
      }
    }
    return out;
  }
  return null;
}

  const d=await store.get("tt:w:"+keyOf(cur));
  week=migrateWeek(d)||new Array(N).fill(null);
  undoStack=[];
  renderHead();renderDayNav();paintCells();paintDay();renderMeter();renderTotals();
}

/* startDate/endDate to the minute, catId — overwrites (blocks out) whatever was logged before */
async function applyRange(startDate,endDate,catId){
  let t=floor1(startDate).getTime();
  let end=ceil1(endDate).getTime();
  if(end<=t)end=t+60000;
  const groups={};
  for(;t<end;t+=60000){
    const d=new Date(t);
    const mon=mondayOf(d);
    const dayIdx=dayIndexInWeek(d);
    if(dayIdx<0||dayIdx>6)continue;
    const minute=d.getHours()*60+d.getMinutes();
    const wk=keyOf(mon);
    if(!groups[wk])groups[wk]={idx:[]};
    groups[wk].idx.push(dayIdx*SLOTS+minute);
  }
  for(const wk in groups){
    const idx=groups[wk].idx;
    if(wk===keyOf(cur)){
      snapshot();
      for(const i of idx)week[i]=catId;
      renderAll();save();
    }else{
      const existing=migrateWeek(await store.get("tt:w:"+wk))||new Array(N).fill(null);
      for(const i of idx)existing[i]=catId;
      await store.set("tt:w:"+wk,existing);
    }
  }
  sel=catId;renderChips();
}

      +'<div class="swrunning-actions">'

        +'<button class="swbtn ghost" id="swDiscardBtn">Discard</button>'

  });

  if(runningTimer){

      runningTimer=null;await store.del("tt:running");updateTimerTabLabel();
      await applyRange(startDate,endDate,catId);
      renderStopwatchTab();
    };
    $("#swDiscardBtn").onclick=()=>{
      if(!confirm("Discard this timer without logging it?"))return;
      runningTimer=null;store.del("tt:running");updateTimerTabLabel();renderStopwatchTab();
    };
  }
}
async function tileTap(catId){
  if(!runningTimer){
    runningTimer={catId,startTs:Date.now()};
    await store.set("tt:running",runningTimer);
    updateTimerTabLabel();renderStopwatchTab();
    return;
  }
  if(runningTimer.catId===catId)return;
  const startDate=new Date(runningTimer.startTs), endDate=new Date(), prevCat=runningTimer.catId;
  await applyRange(startDate,endDate,prevCat);
  runningTimer={catId,startTs:Date.now()};
  await store.set("tt:running",runningTimer);
  updateTimerTabLabel();renderStopwatchTab();
}

    b.onclick=()=>{
      apDay=d;dayWrap.querySelectorAll("button").forEach(x=>x.className="");b.className="on";
      apStart=defaultStartForDay(apDay);apEnd=Math.min(SLOTS,apStart+60);
      setPickerTimes(apStart,apEnd);setTypeTimes(apStart,apEnd);
    };
    dayWrap.appendChild(b);
  });
  sheet.appendChild(dayWrap);

  const catCap=document.createElement("div");catCap.className="cap";catCap.style.margin="16px 0 8px";catCap.textContent="Category";
  sheet.appendChild(catCap);
  sheet.appendChild(buildCatPicker(apCat,id=>apCat=id));

  const timeCap=document.createElement("div");timeCap.className="cap";
  timeCap.style.cssText="margin:16px 0 8px;display:flex;justify-content:space-between;align-items:baseline";
  const timeCapLabel=document.createElement("span");timeCapLabel.textContent="Time";
  const modeBtn=document.createElement("button");modeBtn.className="timemode";
  timeCap.appendChild(timeCapLabel);timeCap.appendChild(modeBtn);
  sheet.appendChild(timeCap);

  const pickWrap=document.createElement("div");pickWrap.className="timerow";
  const selStart=document.createElement("select"), selEnd=document.createElement("select");
  for(let q=0;q<QSLOTS;q++){
    const o=document.createElement("option");o.value=q;o.textContent=qLabel(q);
    selStart.appendChild(o);
  }
  for(let q=1;q<=QSLOTS;q++){
    const o=document.createElement("option");o.value=q;o.textContent=qLabel(q);
    selEnd.appendChild(o);
  }
  selStart.onchange=()=>{
    const v=+selStart.value;
    if(+selEnd.value<=v){selEnd.value=Math.min(QSLOTS,v+4)}
  };
  pickWrap.appendChild(selStart);
  const to1=document.createElement("span");to1.textContent="to";pickWrap.appendChild(to1);
  pickWrap.appendChild(selEnd);
  sheet.appendChild(pickWrap);

  const typeWrap=document.createElement("div");typeWrap.className="timerow";
  const typeStart=document.createElement("input"),typeEnd=document.createElement("input");
  typeStart.type=typeEnd.type="text";
  typeStart.autocomplete=typeEnd.autocomplete="off";
  typeStart.placeholder="9:07a";typeEnd.placeholder="10:52a";
  typeWrap.appendChild(typeStart);
  const to2=document.createElement("span");to2.textContent="to";typeWrap.appendChild(to2);
  typeWrap.appendChild(typeEnd);
  sheet.appendChild(typeWrap);

  /* s/e here are exact minutes-of-day; the Pick dropdown only offers quarter-hours,
     so it's rounded to the nearest one, while Type keeps full minute precision. */
  function setPickerTimes(s,e){
    selStart.value=Math.min(QSLOTS,Math.round(s/15));
    selEnd.value=Math.min(QSLOTS,Math.round(e/15));
  }
  function setTypeTimes(s,e){typeStart.value=minuteLabel(s);typeEnd.value=minuteLabel(e)}
  setPickerTimes(apStart,apEnd);setTypeTimes(apStart,apEnd);

  function applyMode(){
    pickWrap.style.display=timeInputMode==="pick"?"flex":"none";
    typeWrap.style.display=timeInputMode==="type"?"flex":"none";
    modeBtn.textContent=timeInputMode==="pick"?"Type it in":"Pick instead";
  }
  modeBtn.onclick=()=>{
    if(timeInputMode==="pick"){
      setTypeTimes((+selStart.value)*15,(+selEnd.value)*15);
      timeInputMode="type";
    }else{
      const s=parseTimeStr(typeStart.value),e=parseTimeStr(typeEnd.value);
      if(s!=null)selStart.value=Math.min(QSLOTS,Math.round(s/15));
      if(e!=null)selEnd.value=Math.min(QSLOTS,Math.round(e/15));
      timeInputMode="pick";
    }
    try{localStorage.setItem("tt:timemode",timeInputMode)}catch(e){}
    applyMode();
  };
  applyMode();

  const addBtn=document.createElement("button");
  addBtn.className="act";addBtn.style.textAlign="center";addBtn.style.fontWeight="600";addBtn.style.marginTop="16px";
  addBtn.textContent="Add";
  addBtn.onclick=()=>{
    let s,e; // minutes-of-day
    if(timeInputMode==="type"){
      s=parseTimeStr(typeStart.value);e=parseTimeStr(typeEnd.value);
      if(s==null||e==null){alert("Couldn't read one of those times. Try things like 9:07a, 2:30pm, or 14:52.");return}
    }else{
      s=(+selStart.value)*15;e=(+selEnd.value)*15;
    }
    if(e<=s){alert("End time must be after start time.");return}
    snapshot();
    for(let m=s;m<e;m++)week[apDay*SLOTS+m]=apCat; // overwrites — blocks out whatever was there
    sel=apCat;renderChips();
    dOff=apDay;
    renderAll();save();closeSheet();
    document.querySelector('.tab[data-v="day"]').click();
    $("#daywrap").scrollTop=Math.max(0,(Math.floor(s/60)-2)*CELLZ*4);
  };
  sheet.appendChild(addBtn);

  scrim.classList.add("on");
}

function openMenu(){
  sheet.innerHTML='<h3>Week</h3>';
  const mk=(label,fn,cls)=>{
    const b=document.createElement("button");b.className="act"+(cls?" "+cls:"");b.textContent=label;b.onclick=fn;sheet.appendChild(b);
  };
  mk("Copy last week into this week",async()=>{
    const d=migrateWeek(await store.get("tt:w:"+keyOf(shift(cur,-7))));
    if(!d){alert("Nothing logged last week to copy.");return}
    snapshot();week=d.slice();renderAll();save();closeSheet();
  });
  mk("Edit categories",openCats);
  const h2=document.createElement("h3");h2.textContent="Data";h2.style.marginTop="18px";sheet.appendChild(h2);
  mk("Export backup (.json)",exportData);
  mk("Import backup",importData);
  mk("Clear this week",()=>{
    if(!confirm("Clear all entries for this week?"))return;
    snapshot();week=new Array(N).fill(null);renderAll();save();closeSheet();
  },"danger");
  scrim.classList.add("on");
}

function openCats(){
  const m=totalsByCat();
  sheet.innerHTML='<h3>Categories</h3>';
  const wrap=document.createElement("div");
  for(const c of cats){
    const row=document.createElement("div");row.className="catrow";
    row.innerHTML='<u style="background:'+c.color+'"></u><span>'+esc(c.name)+'</span>'
      +'<span class="hrs">'+(m[c.id]?fmtH(m[c.id]/60)+" h":"")+'</span>';
    const x=document.createElement("button");x.textContent="×";
    x.onclick=()=>{
      if(cats.length<2)return;
      if(m[c.id]&&!confirm("Remove "+c.name+"? Its "+fmtH(m[c.id]/60)+" h this week will be cleared."))return;
      snapshot();
      cats=cats.filter(z=>z.id!==c.id);
      for(let i=0;i<N;i++)if(week[i]===c.id)week[i]=null;
      if(sel===c.id)sel=cats[0].id;
      store.set("tt:cats",cats);save();renderChips();renderAll();openCats();
    };
    row.appendChild(x);wrap.appendChild(row);
  }
  sheet.appendChild(wrap);

  const nc=document.createElement("div");nc.className="newcat";
  nc.innerHTML='<input id="ncn" placeholder="New category" maxlength="18"><button id="ncb">Add</button>';
  sheet.appendChild(nc);
  const sw=document.createElement("div");sw.className="swatches";
  SWATCH.forEach(col=>{
    const u=document.createElement("u");u.style.background=col;
    if(col===newColor)u.className="on";
    u.onclick=()=>{newColor=col;sw.querySelectorAll("u").forEach(z=>z.className="");u.className="on"};
    sw.appendChild(u);
  });
  sheet.appendChild(sw);
  sheet.querySelector("#ncb").onclick=()=>{
    const v=sheet.querySelector("#ncn").value.trim();
    if(!v)return;
    const id="c"+Date.now().toString(36);
    cats.push({id,name:v,color:newColor});
    sel=id;store.set("tt:cats",cats);renderChips();closeSheet();
  };
  scrim.classList.add("on");
}

/* ---------- backup ---------- */
function exportData(){
  const data={app:"168",version:1,exported:new Date().toISOString(),entries:{}};
  for(const k of store.keys())data.entries[k]=JSON.parse(localStorage.getItem(k));
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="168-backup-"+keyOf(new Date())+".json";
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  closeSheet();
}
function importData(){
  const inp=document.createElement("input");
  inp.type="file";inp.accept="application/json,.json";
  inp.onchange=()=>{
    const f=inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=async()=>{
      try{
        const d=JSON.parse(rd.result);
        if(!d.entries)throw 0;
        if(!confirm("Import "+Object.keys(d.entries).length+" saved items? This replaces matching weeks."))return;
        for(const k in d.entries)localStorage.setItem(k,JSON.stringify(d.entries[k]));
        const c=await store.get("tt:cats");
        if(Array.isArray(c)&&c.length){cats=c;sel=cats[0].id;renderChips()}
        closeSheet();loadWeek();
      }catch(e){alert("That file isn't a 168 backup.")}
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------- offline ---------- */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

/* ---------- boot ---------- */
(async function init(){
  const saved=await store.get("tt:cats");
  if(Array.isArray(saved)&&saved.length)cats=saved;
  sel=cats[0].id;
  renderChips();
  runningTimer=await store.get("tt:running");
  updateTimerTabLabel();
  await loadWeek();
  const now=new Date();
  $("#daywrap").scrollTop=Math.max(0,(now.getHours()-2)*CELLZ*4);
  $("#gridwrap").scrollTop=Math.max(0,(now.getHours()-2)*4*15);
})();
</script>
